name: Build KVHao AutoPotion Infernal RotW EXE
on:
  push:
    branches:
      - build/kvhao-autopotion-infernal-rotw
      - build/kvhao-autopotion-v8-viet-hoa
      - build/kvhao-autopotion-v9-loader-diagnostics
      - build/kvhao-autopotion-v10-loader-process
    paths:
      - autopotion-build/**
      - .github/workflows/kvhao-autopotion-exe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout KVHao patch
        uses: actions/checkout@v4
      - name: Setup Python 3.11 (Windows x64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Fetch original AutoPotion
        run: |
          git clone --depth 1 https://github.com/DavidPinto/D2R-Infernal-AutoPotion.git upstream
          if ($LASTEXITCODE -ne 0) { throw "Unable to download original AutoPotion" }
      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed" }
          python -m pip install --disable-pip-version-check -r upstream/requirements.txt "pyinstaller>=6,<7"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
      - name: Apply compatibility patch without UI monkey-patching
        run: |
          python autopotion-build/patch.py upstream
          if ($LASTEXITCODE -ne 0) { throw "Patch failed due to incompatible source" }
          python -m compileall -q upstream
          if ($LASTEXITCODE -ne 0) { throw "Syntax validation failed" }
      - name: Add D2RLoader process diagnostics
        run: |
          python autopotion-build/loader_diagnostics.py upstream
          if ($LASTEXITCODE -ne 0) { throw "D2RLoader diagnostics patch failed" }
          python -m compileall -q upstream/ui upstream/d2r
          if ($LASTEXITCODE -ne 0) { throw "D2RLoader compatibility syntax check failed" }
      - name: Accept D2RLoader as native game process
        run: |
          python autopotion-build/loader_game_process.py upstream
          if ($LASTEXITCODE -ne 0) { throw "Game process compatibility patch failed" }
          python -m compileall -q upstream/ui upstream/d2r
          if ($LASTEXITCODE -ne 0) { throw "Game process compatibility syntax check failed" }
          python autopotion-build/test_game_process.py upstream
          if ($LASTEXITCODE -ne 0) { throw "Game process recognition test failed" }
      - name: Localize UI safely (Vietnamese, display-only)
        run: |
          python autopotion-build/localize_source.py upstream
          if ($LASTEXITCODE -ne 0) { throw "Vietnamese UI transformation failed" }
          python -m compileall -q upstream/ui
          if ($LASTEXITCODE -ne 0) { throw "Vietnamese UI syntax check failed" }
      - name: Smoke test full GUI startup (without game)
        run: |
          python autopotion-build/smoke_gui.py upstream
          if ($LASTEXITCODE -ne 0) { throw "GUI failed to start, aborting EXE build" }
      - name: Build Windows EXE (Infernal/RotW)
        run: |
          Push-Location upstream
          try {
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name KVHao_AutoPotion --collect-all customtkinter main.py
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          } finally {
            Pop-Location
          }
      - name: Verify Windows PE executable
        run: |
          $path = "upstream/dist/KVHao_AutoPotion.exe"
          if (!(Test-Path $path)) { throw "EXE file missing" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          if ($bytes.Length -lt 100000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Invalid EXE" }
          Write-Host "Verified PE EXE: $($bytes.Length) bytes"
      - name: Smoke test packaged EXE startup
        run: |
          $exe = (Resolve-Path upstream/dist/KVHao_AutoPotion.exe).Path
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 8
            $process.Refresh()
            if ($process.HasExited) {
              throw "The packaged EXE exited during GUI startup. ExitCode=$($process.ExitCode)"
            }
            Write-Host "EXE_STARTUP_OK: application process remains running"
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Create distribution ZIP
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item upstream/dist/KVHao_AutoPotion.exe release/
          Copy-Item upstream/LICENSE release/LICENSE_DavidPinto.txt
          Copy-Item autopotion-build/CREDITS.txt release/CREDITS.txt
          @'
          KVHao AutoPotion - Infernal/RotW
          Start KVHao_AutoPotion.exe directly. No Python required.
          IMPORTANT: This tool is an external companion, NOT a D2RLoader DLL.
          Start D2R via D2RLoader, then launch the EXE separately. It can attach to D2R.exe or D2RLoader.exe as the real game process.
          If not connected, use the Diagnostics tab's "Kiem tra D2RLoader" button.
          If the game is found but offsets remain unresolved, export the Diagnostics report. Recognition is not proof that offsets are valid.
          First verify health/mana/belt memory reads in Diagnostics, then enable.
          Automated gameplay may lead to sanctions on Battle.net Online.
          Interface: Vietnamese UI text with original internal game logic. Localization and packaging: KVHao.
          Original author: DavidPinto; MIT license retained.
          '@ | Set-Content -Path release/README.txt -Encoding utf8
          Compress-Archive release/* KVHao_AutoPotion_v10_D2RLoader_GameProcess_EXE.zip -Force
      - name: Upload EXE release
        uses: actions/upload-artifact@v4
        with:
          name: KVHao_AutoPotion_v10_D2RLoader_GameProcess_EXE
          path: KVHao_AutoPotion_v10_D2RLoader_GameProcess_EXE.zip
          if-no-files-found: error
          retention-days: 30
